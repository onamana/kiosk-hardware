logLevel: info
rtspTransports: [tcp]

# Browser playback endpoints.
hls: true
hlsAddress: :8888
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

# Set the real camera source with an environment variable before running:
#   export MTX_PATHS_STREAM1_SOURCE="rtsp://user:password@camera-ip:554/stream1"
#   ./mediamtx mediamtx.yml
paths:
  stream1:
    source: publisher
    sourceOnDemand: yes
    rtspTransport: tcp
